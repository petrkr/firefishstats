<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Chyba – Investiční účty</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2em;
            max-width: 800px;
        }
        .error-box {
            background-color: #fee;
            border: 2px solid #faa;
            border-radius: 8px;
            padding: 2em;
            margin: 2em 0;
        }
        .error-title {
            color: #c00;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 1em;
        }
        .error-message {
            margin-bottom: 1.5em;
            line-height: 1.6;
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        .instructions {
            background-color: #f9f9f9;
            border-left: 4px solid #007bff;
            padding: 1em;
            margin-top: 1.5em;
        }
        .instructions h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Chyba konfigurace</h1>

    <div class="error-box">
        <div class="error-title">Konfigurace nenalezena</div>
        <div class="error-message">{{ error }}</div>

        <div class="instructions">
            <h3>Jak to opravit:</h3>
            <ol>
                <li>Zkopírujte <code>config.json.example</code> na <code>config.json</code></li>
                <li>Upravte <code>config.json</code> a vyplňte své API kredenciály</li>
                <li>Restartujte aplikaci</li>
            </ol>
        </div>
    </div>

</body>
</html>
